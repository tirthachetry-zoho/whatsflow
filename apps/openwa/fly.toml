app = 'openwa'
primary = 'iad'

[build]
  image = 'ghcr.io/rmyndharis/openwa:latest'

[env]
  NODE_ENV = 'production'
  PORT = '2785'
  ENGINE_TYPE = 'baileys'

[http_service]
  internal_port = 2785
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 20
    soft_limit = 10

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
