app = 'freebuff'
primary = 'iad'

[build]
  dockerfile = '../../Dockerfile'
  ignorefile = '../../.dockerignore'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 30

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
