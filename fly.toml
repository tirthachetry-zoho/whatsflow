# fly.toml — Freebuff Desktop on Fly.io
# Run: flyctl launch --copy-config --name freebuff
# Then: flyctl secrets set AUTH_SECRET=$(openssl rand -base64 32)

app = 'freebuff'
primary = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
